<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Jokenpô</title>
</head>
<body>
   <div class="game-container">
    <h1>Jokenpô ✊✋✌️</h1>

    <p>Escolha uma das opções abaixo para jogar contra o computador:</p>

    <div class="choice">
        <div class="choice-btn" onclick="jogar('pedra')">✊ Pedra</div>
        <div class="choice-btn" onclick="jogar('papel')">✋ Papel</div>
        <div class="choice-btn" onclick="jogar('tesoura')">✌️ Tesoura</div>
    </div>

    <div class="result-box">
        <p>Você escolheu: <span id="player-choice">-</span></p>
        <p>Computador escolheu: <span id="computer-choice">-</span></p>
        <h2 id="game-result">Quem vencerá?</h2>
    </div>

    <button id="reset-btn" onclick="reiniciar()">Reiniciar jogo 🔄</button>
   </div>

    <script src="script.js"></script>
</body>
</html>
